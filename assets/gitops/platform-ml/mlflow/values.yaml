# MLflow tracking server: metadata in CloudNativePG, artifacts proxied to the Garage bucket "mlflow"
backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: mlflow-db-rw.mlflow.svc.cluster.local
    port: 5432
    database: mlflow
    user: mlflow
  existingDatabaseSecret:
    name: mlflow-db-app
    usernameKey: username
    passwordKey: password
artifactRoot:
  proxiedArtifactStorage: true
  s3:
    enabled: true
    bucket: mlflow
    existingSecret:
      name: mlflow-s3
extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: http://garage.gitlab.svc.cluster.local:3900
  AWS_DEFAULT_REGION: garage
  # MLflow 3 rejects Host headers outside this list; the in-cluster service names are what Jupyter uses
  MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow.mlflow,mlflow.mlflow.svc,mlflow.mlflow.svc.cluster.local,localhost,localhost:*,127.0.0.1,127.0.0.1:*,{{mlflowHost}}"
  # Browsers send Origin on same-site POSTs; MLflow 3 blocks state-changing requests from origins outside this list
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://{{mlflowHost}},http://localhost:5000,http://127.0.0.1:5000"
