# Evidently UI for the drift-monitoring hands-on, kept as plain manifests in devops/platform
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evidently
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{gitlabUrl}}/devops/platform.git
    targetRevision: main
    path: evidently/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: evidently
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
