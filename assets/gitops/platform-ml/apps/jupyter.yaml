# JupyterLab for the MLflow hands-on, kept as plain manifests in devops/platform
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{gitlabUrl}}/devops/platform.git
    targetRevision: main
    path: jupyter/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
