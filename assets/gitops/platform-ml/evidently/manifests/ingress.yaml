# Serves the Evidently UI by name; sslip.io resolves the host to the evidently namespace gateway IP from cloud-provider-kind
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evidently
  namespace: evidently
spec:
  ingressClassName: cloud-provider-kind
  rules:
    - host: {{evidentlyHost}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evidently-service-internal
                port:
                  number: 8000
