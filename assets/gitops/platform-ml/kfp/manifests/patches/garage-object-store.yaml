# Points the API server, UI, Argo executor and launcher at Garage; credentials live in Secret kfp-garage-artifact (created with kubectl)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
        - name: ml-pipeline-api-server
          env:
            - name: OBJECTSTORECONFIG_HOST
              value: garage.gitlab.svc.cluster.local
            - name: OBJECTSTORECONFIG_PORT
              value: "3900"
            # Garage signs with its own region; the API server defaults to us-east-1 and would be rejected
            - name: OBJECTSTORECONFIG_REGION
              value: garage
            - name: OBJECTSTORECONFIG_ACCESSKEY
              valueFrom:
                secretKeyRef: {name: kfp-garage-artifact, key: accesskey}
            - name: OBJECTSTORECONFIG_SECRETACCESSKEY
              valueFrom:
                secretKeyRef: {name: kfp-garage-artifact, key: secretkey}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-ui
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
        - name: ml-pipeline-ui
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: kfp-garage-artifact, key: accesskey}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: kfp-garage-artifact, key: secretkey}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfp-launcher
  namespace: kubeflow
data:
  defaultPipelineRoot: s3://mlpipeline/v2/artifacts
  providers: |-
    s3:
      default:
        endpoint: http://garage.gitlab.svc.cluster.local:3900
        disableSSL: true
        region: garage
        forcePathStyle: true
        credentials:
          fromEnv: false
          secretRef:
            secretName: kfp-garage-artifact
            accessKeyKey: accesskey
            secretKeyKey: secretkey
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-install-config
  namespace: kubeflow
data:
  defaultPipelineRoot: s3://mlpipeline/v2/artifacts
  # The UI reads this key and only previews artifacts from exactly allow-listed store origins
  ALLOWED_ARTIFACT_ENDPOINTS: http://garage.gitlab.svc.cluster.local:3900
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: kubeflow
data:
  artifactRepository: |
    archiveLogs: true
    s3:
      endpoint: "garage.gitlab.svc.cluster.local:3900"
      region: garage
      bucket: "mlpipeline"
      keyFormat: "private-artifacts/{{workflow.namespace}}/{{workflow.name}}/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{pod.name}}"
      insecure: true
      accessKeySecret:
        name: kfp-garage-artifact
        key: accesskey
      secretKeySecret:
        name: kfp-garage-artifact
        key: secretkey
