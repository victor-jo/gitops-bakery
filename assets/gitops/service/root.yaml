# Root Argo CD Application for devops/service: one Application per app under apps/ is created from git
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{gitlabUrl}}/devops/service.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Deleting the last app empties this repo; without this Argo CD refuses to prune it
      allowEmpty: true
