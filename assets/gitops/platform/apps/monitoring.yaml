# kube-prometheus-stack from the upstream chart, with values and dashboards kept in devops/platform
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: {{gitlabUrl}}/devops/platform.git
      targetRevision: main
      ref: values
    - repoURL: {{gitlabUrl}}/devops/platform.git
      targetRevision: main
      path: monitoring/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator CRDs exceed the annotation size limit of client-side apply
      - ServerSideApply=true
